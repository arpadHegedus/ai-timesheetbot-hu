# Dev stack: hot reload for both services, source mounted from this folder.
#   docker compose up --build
#   UI:  http://localhost:5173    API: http://localhost:8000/docs
services:
  backend:
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/firebase.json
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - ./secrets:/secrets:ro   # put firebase.json (service account key) here
  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile.dev }
    ports: ["5173:5173"]
    environment:
      API_TARGET: http://backend:8000
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CHOKIDAR_USEPOLLING: "true"   # file watching over WSL/Windows mounts
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules   # keep container-built deps out of the host folder
    depends_on: [backend]
volumes:
  frontend_node_modules:
