[supervisord]
nodaemon=true
user=root

[program:uvicorn]
command=uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
# Cloud Run (and any health check) considers the container ready as soon as something answers
# on 8080. Without this wait, nginx opens 8080 immediately while uvicorn is still importing
# (langgraph/google-genai/etc take a second or two), so every cold start serves 502s on /api/*
# until uvicorn catches up. Block nginx's own startup on uvicorn's health check first.
command=sh -c 'until curl -sf http://127.0.0.1:8000/health >/dev/null; do sleep 0.2; done; exec nginx -g "daemon off;"'
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
